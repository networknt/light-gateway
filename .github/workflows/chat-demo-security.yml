name: Chat demo security

on:
  pull_request:
    branches: [master, 2.x]
    paths:
      - 'config/ai-gateway/public/**'
      - 'config/llmchat-gateway/public/**'
      - 'config/llmchat-rendezvous/public/**'
      - 'k8s/light-gateway/public-configmap.yaml'
      - 'tests/test_chat_demo_security.py'
      - '.github/workflows/chat-demo-security.yml'
  push:
    branches: [master, 2.x]
    paths:
      - 'config/ai-gateway/public/**'
      - 'config/llmchat-gateway/public/**'
      - 'config/llmchat-rendezvous/public/**'
      - 'k8s/light-gateway/public-configmap.yaml'
      - 'tests/test_chat_demo_security.py'
      - '.github/workflows/chat-demo-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify chat rendering, session lifetime and channel generation
        env:
          # Explicit opt-in for this disposable hosted runner only; local runs keep the sandbox.
          BROWSER_NO_SANDBOX: '1'
        run: |
          export BROWSER_BIN="$(command -v google-chrome)"
          "$BROWSER_BIN" --version
          /usr/bin/python3 --version
          /usr/bin/python3 -B -m unittest discover -s tests -p test_chat_demo_security.py
